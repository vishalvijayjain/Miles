<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="miles-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5D44" />
      <stop offset="100%" stop-color="#354431" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="url(#miles-grad)" />
  
  <!-- Geometric "M" Milestone & Kanban Pillars -->
  <!-- Left Pillar -->
  <rect x="14" y="16" width="6" height="32" rx="3" fill="#FDFBF7" />
  
  <!-- Right Pillar -->
  <rect x="44" y="16" width="6" height="32" rx="3" fill="#FDFBF7" />
  
  <!-- Center Chevron / Milestone Path -->
  <path d="M20 20 L32 34 L44 20" fill="none" stroke="#FDFBF7" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Momentum Indicator dot -->
  <circle cx="32" cy="18" r="3.5" fill="#D4A373" />
</svg>
